name: Crypto risk-on scanner

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Wake at :15 every hour during schedule verification. config/report_schedule.json decides which
    # America/Chicago hours send a report, without editing this workflow.
    - cron: "15 * * * *"

concurrency:
  group: risk-on-scanner
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout persistent scanner data
        uses: actions/checkout@v4
        with:
          ref: scanner-data
          path: .scanner-data
          fetch-depth: 1
      - name: Restore persistent scanner state
        shell: bash
        run: |
          if [[ -f .scanner-data/state.json ]]; then
            cp .scanner-data/state.json state.json
          fi
      - name: Deduplicate scheduled reporting window
        id: gate
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          timezone="$(jq -r '.timezone // "America/Chicago"' config/report_schedule.json)"
          central_hour="$(TZ="$timezone" date +%H)"
          configured="$(jq -r --arg hour "$central_hour" '.report_times[] | select(startswith($hour + ":"))' config/report_schedule.json | head -1)"
          if [[ -z "$configured" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a configured reporting hour: $central_hour in $timezone."
            exit 0
          fi
          slot="$(TZ="$timezone" date +%F)-${central_hour}"
          previous_slot="$(jq -r '.last_email_window // empty' state.json 2>/dev/null || true)"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          if [[ "$previous_slot" == "$slot" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Reporting window $slot already emailed; fallback run will exit."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q
      - name: Scan and email
        if: steps.gate.outputs.run == 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--history .scanner-data/history/runs.jsonl)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.head_commit.message }}" != *"[email-test]"* ]]; then
            args+=(--no-email)
          fi
          python -m src.scanner "${args[@]}"
      - name: Publish persistent scanner state and history
        if: steps.gate.outputs.run == 'true' && success()
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            tmp="$(mktemp)"
            jq --arg slot "${{ steps.gate.outputs.slot }}" '.last_email_window = $slot' state.json > "$tmp"
            mv "$tmp" state.json
          fi
          cp state.json .scanner-data/state.json
          git -C .scanner-data config user.name "risk-on-scanner[bot]"
          git -C .scanner-data config user.email "risk-on-scanner[bot]@users.noreply.github.com"
          git -C .scanner-data add -f state.json history/runs.jsonl
          if ! git -C .scanner-data diff --cached --quiet; then
            git -C .scanner-data commit -m "Record scanner run ${{ github.run_id }}"
            git -C .scanner-data push origin scanner-data
          fi
      - name: Upload report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
