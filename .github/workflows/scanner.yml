name: Crypto risk-on scanner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      report_mode:
        description: Report type
        required: false
        default: daily
        type: choice
        options:
          - daily
          - weekly

concurrency:
  group: risk-on-scanner
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout persistent scanner data
        uses: actions/checkout@v4
        with:
          ref: scanner-data
          path: .scanner-data
          fetch-depth: 1
      - name: Restore persistent scanner state
        shell: bash
        run: |
          if [[ -f .scanner-data/state.json ]]; then
            cp .scanner-data/state.json state.json
          fi
      - name: Initialize run gate
        id: gate
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q
      - name: Scan and email
        if: steps.gate.outputs.run == 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
        shell: bash
        run: |
          args=(--history .scanner-data/history/runs.jsonl)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.head_commit.message }}" != *"[email-test]"* ]]; then
            args+=(--no-email)
          fi
          report_mode="${{ inputs.report_mode || 'daily' }}"
          python -m src.scanner "${args[@]}" --report-mode "$report_mode"
      - name: Publish persistent scanner state and history
        if: steps.gate.outputs.run == 'true' && success()
        shell: bash
        run: |
          cp state.json .scanner-data/state.json
          git -C .scanner-data config user.name "risk-on-scanner[bot]"
          git -C .scanner-data config user.email "risk-on-scanner[bot]@users.noreply.github.com"
          git -C .scanner-data add -f state.json history/runs.jsonl
          if ! git -C .scanner-data diff --cached --quiet; then
            git -C .scanner-data commit -m "Record scanner run ${{ github.run_id }}"
            git -C .scanner-data push origin scanner-data
          fi
      - name: Upload report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
